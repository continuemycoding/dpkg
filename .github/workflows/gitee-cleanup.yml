name: Cleanup Gitee Control Releases

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只列出将删除的版本，不真正删除
        required: false
        type: boolean
        default: false

concurrency:
  group: gitee-control-release-cleanup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 删除控制端四个仓库中除最新版以外的发行版
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: python
        run: |
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GITEE_TOKEN"]
          dry_run = os.environ.get("DRY_RUN", "false").lower() == "true"
          repos = [
              "RemotePro/RemotePro-windows",
              "RemotePro/RemotePro-macos",
              "RemotePro/RemotePro-android",
              "RemotePro/RemotePro-iphone",
          ]

          def call(method, url):
              sep = "&" if "?" in url else "?"
              full = url + sep + "access_token=" + urllib.parse.quote(token)
              req = urllib.request.Request(
                  full,
                  method=method,
                  headers={"User-Agent": "dpkg-gitee-cleanup", "Accept": "application/json"},
              )
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(req, timeout=60) as resp:
                          return resp.status, resp.read().decode()
                  except urllib.error.HTTPError as exc:
                      body = exc.read().decode()
                      if exc.code in (429, 500, 502, 503, 504) and attempt < 4:
                          time.sleep(2 * (attempt + 1))
                          continue
                      return exc.code, body
                  except Exception as exc:
                      if attempt < 4:
                          time.sleep(2 * (attempt + 1))
                          continue
                      return 0, str(exc)
              return 0, "retry exhausted"

          print("dry_run=" + str(dry_run))
          failed = False
          for repo in repos:
              releases = []
              page = 1
              listed = True
              while True:
                  status, body = call(
                      "GET",
                      "https://gitee.com/api/v5/repos/" + repo + "/releases?direction=desc&page=" + str(page) + "&per_page=100",
                  )
                  if status != 200:
                      print(repo + ": 列出发行版失败 " + str(status) + " " + body[:300])
                      failed = True
                      listed = False
                      break
                  batch = json.loads(body)
                  if not isinstance(batch, list):
                      print(repo + ": 返回格式异常 " + body[:300])
                      failed = True
                      listed = False
                      break
                  releases.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1

              if not listed:
                  continue
              if not releases:
                  print(repo + ": 没有发行版")
                  continue

              releases.sort(key=lambda item: (item.get("created_at") or "", item.get("id") or 0), reverse=True)
              keep = releases[0]
              print(
                  repo
                  + ": 保留 "
                  + str(keep.get("tag_name"))
                  + " id="
                  + str(keep.get("id"))
                  + " created="
                  + str(keep.get("created_at"))
                  + " 共 "
                  + str(len(releases))
                  + " 个"
              )

              for rel in releases[1:]:
                  tag = str(rel.get("tag_name"))
                  rel_id = rel.get("id")
                  if dry_run:
                      print("  [dry-run] 将删除 " + tag + " id=" + str(rel_id))
                      continue
                  status, body = call("DELETE", "https://gitee.com/api/v5/repos/" + repo + "/releases/" + str(rel_id))
                  print("  发行版 " + tag + " id=" + str(rel_id) + " -> " + str(status) + " " + body[:180])
                  if status not in (200, 204):
                      failed = True
                  encoded = urllib.parse.quote(tag, safe="")
                  status, body = call("DELETE", "https://gitee.com/api/v5/repos/" + repo + "/git/refs/tags/" + encoded)
                  print("  标签 " + tag + " -> " + str(status) + " " + body[:180])
                  if status not in (200, 204, 404):
                      failed = True
                  time.sleep(0.2)

              if dry_run:
                  continue

              status, body = call(
                  "GET",
                  "https://gitee.com/api/v5/repos/" + repo + "/releases?direction=desc&page=1&per_page=100",
              )
              if status != 200:
                  print(repo + ": 复核失败 " + str(status) + " " + body[:300])
                  failed = True
                  continue
              left = json.loads(body)
              tags = [item.get("tag_name") for item in left]
              print(repo + ": 剩余 " + str(tags))
              if tags != [keep.get("tag_name")]:
                  failed = True

          if failed:
              raise SystemExit(1)
          print("完成")

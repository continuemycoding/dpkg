name: Build APT Repository Index

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai

jobs:
  job:
    runs-on: ubuntu-latest

    env:
      COS_REGION: ap-guangzhou
      TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
      TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Sileo
        env:
          COS_BUCKET: sileo-1302990626
        run: |
          npm install --omit=dev
          npm run build

          dpkg-scanpackages -m debs > Packages

          sed -i 's/Section: Packaging/Section: 应用程序/g' Packages
          sed -i 's/Section: Tweak Injection/Section: 插件/g' Packages
          sed -i 's/Author: YKP/Author: 全场景设备智控方案/g' Packages

          # sed -i 's#debs/#https://debs-1302990626.cos.ap-guangzhou.myqcloud.com/#g' Packages

          zstd -c19 Packages > Packages.zst

          
          awk -v RS='' -v ORS='\n\n' '$0 ~ /(^|\n)Architecture: iphoneos-arm(\n|$)/ && $0 ~ /(^|\n)Package: com.sky.ykpro(\n|$)/' Packages > Packages.tmp && mv Packages.tmp Packages.cydia

          cat -n Packages.cydia

          bzip2 -c9 Packages.cydia > Packages.bz2

          
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: remotepro
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            remotepro/repo:latest

      - name: Install sing-box
        run: |
          set -e
          VERSION=1.8.6
          curl -L -o sing-box.tar.gz \
            https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz
          tar -xzf sing-box.tar.gz
          sudo mv sing-box-${VERSION}-linux-amd64/sing-box /usr/local/bin/sing-box
          sing-box version

      - name: Start trojan proxy
        run: |
          cat > config.json << 'EOF'
          {
            "log": {
              "level": "info"
            },
            "inbounds": [
              {
                "type": "mixed", 
                "tag": "mixed-in",
                "listen": "127.0.0.1",
                "listen_port": 1080
              }
            ],
            "outbounds": [
              {
                "type": "trojan",
                "tag": "trojan-out",
                "server": "f533f9b2-c69a-4dd0-bc63-f2ab94dd5f53.f1eb10ae-1d82-4c6a-b4dd-bd9525520956.com",
                "server_port": 10101,
                "password": "${{ secrets.TROJAN_PASSWORD }}",
                "tls": {
                  "enabled": true,
                  "server_name": "sni.eos-suzhou-4.cmecloud.cn",
                  "utls": {
                    "enabled": true,
                    "fingerprint": "chrome"
                  }
                }
              }
            ],
            "route": {
              "rules": [
                {
                  "inbound": "mixed-in",
                  "outbound": "trojan-out"
                }
              ]
            }
          }
          EOF
          
          nohup sing-box run -c config.json > sing-box.log 2>&1 &
          sleep 5

          # 动态注入环境变量，对后续所有 step 生效
          echo "ALL_PROXY=http://127.0.0.1:1080" >> $GITHUB_ENV
          echo "HTTP_PROXY=http://127.0.0.1:1080" >> $GITHUB_ENV
          echo "HTTPS_PROXY=http://127.0.0.1:1080" >> $GITHUB_ENV

      - name: 🚀 Upload Debian Packages to Gitee Release
        shell: python
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: RemotePro/RemotePro
          PYTHONIOENCODING: utf-8
        run: |
          import os
          import requests
          import json
          import glob
          import sys

          token = os.environ.get('GITEE_TOKEN')
          repo = os.environ.get('GITEE_REPO')
          tag_name = 'v1'

          get_resp = requests.get(f"https://gitee.com/api/v5/repos/{repo}/releases/tags/{tag_name}", params={"access_token": token})
          
          if get_resp.status_code != 200:
              print(f"Failed to find release: {get_resp.text}")
              sys.exit(1)

          release_data = get_resp.json()
          print(json.dumps(release_data, indent=4, ensure_ascii=False))
          release_id = release_data['id']
          
          existing_assets = {asset['name']: asset['id'] for asset in release_data.get('assets', [])}
          
          upload_url = f"https://gitee.com/api/v5/repos/{repo}/releases/{release_id}/attach_files"
          files_to_upload = glob.glob('debs/*')
          files_to_upload.extend(['Packages.zst', 'Packages.bz2', 'Packages'])
          print(files_to_upload)

          for file_path in files_to_upload:
              filename = os.path.basename(file_path)
              
              if filename in existing_assets:
                  print(f"[跳过] {filename} 已存在")
                  continue

              print(f"[上传] {filename}...")
              try:
                  with open(file_path, 'rb') as f:
                      files = {'file': (filename, f)}
                      up_resp = requests.post(upload_url, params={'access_token': token}, files=files)
                      if up_resp.status_code == 201:
                          print(f"[上传成功] {filename}")
                      else:
                          print(f"[上传失败] {filename} : {up_resp.text}")
              except Exception as e:
                  print(f"[异常] {filename}: {e}")
